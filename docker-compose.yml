services:
  postgres:
    image: postgres:16
    container_name: vitriny-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitriny
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitriny}
      POSTGRES_DB: vitriny
    ports:
      # Em produção, mantenha o banco fechado pra internet. Remova este mapeamento
      # ou use 127.0.0.1:5432:5432 pra expor só localmente.
      - "127.0.0.1:5432:5432"
    volumes:
      - vitriny-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitriny -d vitriny"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vitriny

  minio:
    image: minio/minio:latest
    container_name: vitriny-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Não exposto publicamente: o acesso público às imagens passa pelo Caddy
      # (cdn.SEU-DOMINIO). Console só via localhost/túnel SSH se precisar.
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # Console web
    volumes:
      - vitriny-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vitriny

  # Cria o bucket automaticamente na primeira execução
  minio-init:
    image: minio/mc:latest
    container_name: vitriny-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 \$$MINIO_ROOT_USER \$$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/vitriny &&
        mc anonymous set download local/vitriny
      "
    networks:
      - vitriny

  app:
    build:
      context: .
      target: runner
    image: vitriny-app
    container_name: vitriny-app
    restart: unless-stopped
    env_file:
      - .env
    # O próprio container aplica as migrations no start (docker-entrypoint.sh),
    # por isso só precisa do Postgres saudável e do bucket criado.
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Porta interna do app. No Easypanel, aponte o domínio pra este serviço
    # nesta porta (o Traefik do painel faz o proxy + TLS).
    expose:
      - "3000"
    networks:
      - vitriny

# Proxy/TLS: no Easypanel é o Traefik do painel (não coloque Caddy aqui, ele
# briga pelas portas 80/443). Pra VPS crua, use o override:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d

networks:
  vitriny:

volumes:
  vitriny-postgres-data:
  vitriny-minio-data:
