services:
  postgres:
    image: postgres:16
    container_name: vitriny-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitriny
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitriny}
      POSTGRES_DB: vitriny
    volumes:
      - vitriny-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitriny -d vitriny"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: vitriny-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - vitriny-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cria o bucket automaticamente na primeira execução
  minio-init:
    image: minio/mc:latest
    container_name: vitriny-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 \$$MINIO_ROOT_USER \$$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/vitriny &&
        mc anonymous set download local/vitriny
      "

  app:
    build:
      context: .
      target: runner
    image: vitriny-app
    # O proxy (Traefik) do Easypanel roteia o domínio pro host "vitriny_vitriny"
    # (nome do stack). Este container_name faz o app atender exatamente por esse
    # nome na rede, senão dá Bad Gateway. Porta interna: 3000.
    container_name: vitriny_vitriny
    restart: unless-stopped
    env_file:
      - .env
    # O próprio container aplica as migrations no start (docker-entrypoint.sh),
    # por isso só precisa do Postgres saudável e do bucket criado.
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3000"

# Sem rede customizada: os serviços usam a rede default do compose, que é onde o
# proxy do Easypanel se conecta pra alcançar o app.
# Proxy/TLS: no Easypanel é o Traefik do painel. Pra VPS crua, use o override:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d

volumes:
  vitriny-postgres-data:
  vitriny-minio-data:
