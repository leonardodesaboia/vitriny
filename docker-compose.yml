services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitriny
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitriny}
      POSTGRES_DB: vitriny
    volumes:
      - vitriny-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitriny -d vitriny"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - vitriny-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cria o bucket automaticamente na primeira execução
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 \$$MINIO_ROOT_USER \$$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/vitriny &&
        mc anonymous set download local/vitriny
      "

  app:
    build:
      context: .
      target: runner
      # NEXT_PUBLIC_* precisam ser passadas como build arg: o .dockerignore
      # exclui o .env do contexto (segredos não vão pra imagem), então sem
      # isso o `next build` embute "undefined" no bundle do navegador.
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    image: vitriny-app
    # Sem container_name fixo: o Easypanel nomeia/roteia o serviço "app" do jeito
    # dele (o domínio deve apontar pra "Serviço Compose = app", porta 3000).
    restart: unless-stopped
    env_file:
      - .env
    # O próprio container aplica as migrations no start (docker-entrypoint.sh),
    # por isso só precisa do Postgres saudável e do bucket criado.
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    # NOTA (Easypanel/Swarm): o app PRECISA rodar em `endpoint_mode: dnsrr`, pois o
    # load-balancer VIP do Swarm não roteia para serviços em múltiplas redes overlay
    # (Traefik dá 502). PORÉM o Easypanel IGNORA o bloco `deploy:` do compose e
    # recria o serviço em `vip` a cada Deploy — por isso o dnsrr NÃO é declarado
    # aqui, e sim garantido por um systemd no host (vitriny-dnsrr-guard.service),
    # que reaplica dnsrr após cada deploy. Detalhes e runbook:
    # docs/DEPLOY_TROUBLESHOOTING_EASYPANEL.md

# Sem rede customizada: os serviços usam a rede default do compose, que é onde o
# proxy do Easypanel se conecta pra alcançar o app.
# Proxy/TLS: no Easypanel é o Traefik do painel. Pra VPS crua, use o override:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d

volumes:
  vitriny-postgres-data:
  vitriny-minio-data:
